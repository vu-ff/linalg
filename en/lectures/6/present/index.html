<script>(async function () {
  var to = "https://matfiz.atvira-mokykla.lt/algebra/en/lectures/6/present/";
  var anchor = location.hash.slice(1);
  function go(code) {
    location.replace(to + location.search + (code ? "#move=" + code + (anchor ? ";" + anchor : "") : (anchor ? "#" + anchor : "")));
  }
  function b64(bytes) {
    var s = "", chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  try {
    var keys = new RegExp("^linalg-(progress$|activity$|selfcheck-[a-z]{2}-\\d+$|problems-[a-z]{2}$|lab-[a-z]{2}-|review-[a-z]{2}$|drills-[a-z]{2}$|level-[a-z]{2}$|name$|name-address$)"), data = {}, any = false;
    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i);
      if (!key || !keys.test(key)) continue;
      var raw = localStorage.getItem(key);
      if (/^linalg-level-/.test(key)) data[key] = raw;
      else { try { data[key] = JSON.parse(raw); } catch (e) { continue; } }
      any = true;
    }
    if (!any) return go("");
    var json = JSON.stringify(data), code;
    if (window.CompressionStream) {
      var stream = new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"));
      code = "z" + b64(new Uint8Array(await new Response(stream).arrayBuffer()));
    } else {
      code = "j" + b64(new TextEncoder().encode(json));
    }
    // Too long for a link (very rare): go without; the progress code still works by hand.
    go(code.length > 1500000 ? "" : code);
  } catch (e) { go(""); }
})();</script>
